<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="submit-container">
        <h2 class="submit-title">Recuperar Contraseña</h2>
        <form id="recuperationForm" class="submit-form">
            <label for="email" class="submit-label">Ingresa tu correo electrónico:</label>
            <input type="email" id="email" class="submit-input" placeholder="Correo electrónico" required>
            <button type="submit" class="submit-btn">Enviar enlace de recuperación</button>
        </form>
        <div class="submit-links">
            <p class="question"><a href="login.html">Volver al login</a></p>
        </div>
    </div>
</body>
</html>

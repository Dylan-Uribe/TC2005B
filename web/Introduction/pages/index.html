<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Simple</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body data-route="index">
    <div class="submit-container">
        <h2 class="submit-title">Login</h2>
        <form id="loginForm" class="submit-form">
          <label for="email" class="submit-label">Email:</label>
          <input type="email" id="email" class="submit-input" placeholder="Enter your email" required>

          <label for="password" class="submit-label">Password:</label>
          <input type="password" id="password" class="submit-input" placeholder="Enter your password" required>
          <div class="remember-me">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember me</label>
          </div>
            <button type="submit" class="submit-btn" onclick="login()">Sign in</button>
          <div class="submit-links">
            <p class="question">Don't have an account? <a href="signup.html">Sign up</a></p>
            <p class="forgot-password"><a href="recuperation.html">Forgot password?</a></p>
          </div>
        </form>
    </div>
    <script src="../assets/login.js"></script>
    <script src="../assets/app.js" defer></script>
</body>
</html>

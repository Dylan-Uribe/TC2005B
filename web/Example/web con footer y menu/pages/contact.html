<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contacto — MiSitio</title>
  <meta name="description" content="Contáctanos. Formulario accesible con validación básica y partials cargados vía JavaScript." />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>

<body data-route="contact">
  <!-- Header parcial (inyectado vía JS) -->
  <div data-include="../partials/header.html"></div>

  <main id="content" tabindex="-1">
    <section class="hero">
      <h1>Contacto</h1>
      <p>¿Tienes una idea, duda o meme? Escríbenos y te respondemos con cariño.</p>
      <p>En esta página, el link <em>Contacto</em> del menú debe verse activo.</p>
    </section>

    <section aria-labelledby="contact-title">
      <h2 id="contact-title">Envíanos un mensaje</h2>

      <!-- Estado de envío / validación -->
      <div id="formStatus" role="status" aria-live="polite" style="margin:.5rem 0;"></div>

      <form id="contactForm" action="#" method="post">
        <fieldset>
          <legend class="sr-only">Formulario de contacto</legend>

          <div class="form-row">
            <label for="name">Nombre completo</label>
            <input id="name" name="name" type="text" required minlength="2" autocomplete="name" />
          </div>

          <div class="form-row">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" required autocomplete="email" inputmode="email" />
          </div>

          <div class="form-row">
            <label for="subject">Asunto</label>
            <input id="subject" name="subject" type="text" required minlength="3" />
          </div>

          <div class="form-row">
            <label for="message">Mensaje</label>
            <textarea id="message" name="message" rows="6" required minlength="10"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit">Enviar</button>
            <button type="reset">Limpiar</button>
          </div>
        </fieldset>
      </form>

      <p class="muted">Protegemos tus datos. Este formulario es de ejemplo y no envía a un backend.</p>
    </section>
  </main>

  <!-- Footer parcial (inyectado vía JS) -->
  <div data-include="../partials/footer.html"></div>

  <!-- Loader de partials -->
  <script src="../assets/app.js" defer></script>

  <!-- JS mínimo de la página: validación básica y feedback -->
  <script>
    // Comentarios en inglés para PRs.
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contactForm');
      const status = document.getElementById('formStatus');

      const ok = (msg) => {
        status.textContent = msg;
        status.style.color = '#127a4f';
      };
      const err = (msg) => {
        status.textContent = msg;
        status.style.color = '#a3002f';
      };

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        // Use native constraint validation first
        if (!form.checkValidity()) {
          // Show native bubbles/messages
          form.reportValidity();
          err('Por favor corrige los campos marcados.');
          return;
        }
        // Fake submit (no backend). Clear form and show success
        form.reset();
        ok('¡Gracias! Tu mensaje fue recibido. Te contactaremos pronto.');
      });

      form.addEventListener('input', () => {
        // Clear status as the user edits
        status.textContent = '';
      });
    });
  </script>

  <noscript>
    <p style="padding:1rem; background:#fee; color:#900;">
      Necesitas habilitar JavaScript para cargar el menú, el pie y validar el formulario.
    </p>
  </noscript>
</body>
</html>
